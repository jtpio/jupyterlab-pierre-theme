[project]
name = "demo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "jupyterlab-pierre-dark",
    "jupyterlab-pierre-light",
    "jupyterlite-core>=0.8.6",
    "jupyterlite-pyodide-kernel>=0.8.6",
]

[tool.uv.sources]
jupyterlab-pierre-dark = { path = "../packages/jupyterlab-pierre-dark", editable = true }
jupyterlab-pierre-light = { path = "../packages/jupyterlab-pierre-light", editable = true }
